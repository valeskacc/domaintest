<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <title>Home</title>
  <style>
    :root {
      --bg: #000000; --card: #101a19; --text: #eaf6f4; --muted: #7e9997; --border: #223330;
      --primary: #2fd6c6; --primary-ink: #04231f; --danger: #ff6b6b;
      --safe-b: env(safe-area-inset-bottom, 0px); --safe-t: env(safe-area-inset-top, 0px);
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; padding: 0; }
    body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--bg);
           color: var(--text); line-height: 1.45; }
    #app { max-width: 1100px; margin: 0 auto; min-height: 100vh; }
    header.appbar { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 10px;
                    padding: calc(12px + var(--safe-t)) 18px 12px;
                    background: color-mix(in srgb, var(--card) 88%, transparent);
                    backdrop-filter: blur(10px); border-bottom: 1px solid var(--border); }
    header.appbar .title { font-weight: 800; font-size: 1.15rem; flex: 1; color: var(--primary); letter-spacing: .3px; }
    header.appbar button { width: auto; min-height: 34px; padding: 6px 12px; font-size: .8rem; font-weight: 500;
                           color: var(--muted); background: transparent; border: 1px solid var(--border); border-radius: 10px; }
    main { padding: 20px 18px calc(40px + var(--safe-b)); }
    .appnav { display: flex; gap: 6px; margin: 30px 0 0; }
    .appnav a { flex: 1; display: flex; flex-direction: row; align-items: center; justify-content: center; gap: 4px;
      text-decoration: none; color: var(--muted); font-weight: 600; font-size: .62rem;
      padding: 5px 4px; border: 1px solid var(--border); border-radius: 9px; background: transparent; min-height: auto; }
    .appnav a.active { color: var(--primary); border-color: var(--primary); }
    .appnav a .i { font-size: .85rem; }
    .checkrow { display: flex; align-items: center; gap: 8px; font-size: .85rem; color: var(--text);
                font-weight: 500; margin: 14px 0 0; cursor: pointer; }
    .checkrow input { width: 18px; height: 18px; min-height: 0; accent-color: var(--primary); flex: 0 0 auto; }
    h1 { font-size: 1.5rem; margin: 4px 0 2px; }
    p.muted { color: var(--muted); margin: 4px 0 20px; }
    .muted { color: var(--muted); }
    label { display: block; font-size: .8rem; color: var(--muted); margin: 12px 0 6px; font-weight: 600; }
    input, button { font: inherit; color: inherit; width: 100%; min-height: 48px; padding: 12px 14px;
                    border-radius: 12px; border: 1px solid var(--border); background: var(--card); }
    input:focus { outline: 2px solid var(--primary); border-color: var(--primary); }
    button { cursor: pointer; font-weight: 600; }
    button.primary { background: var(--primary); color: var(--primary-ink); border-color: transparent; border-radius: 999px; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 20px; max-width: 380px; margin: 0 auto; }
    .error { color: var(--danger); font-size: .9rem; }
    .center { text-align: center; }
    .spinner { margin: 60px auto; width: 30px; height: 30px; border: 3px solid var(--border);
               border-top-color: var(--primary); border-radius: 50%; animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    /* Kachel-Grid */
    .grid { display: grid; grid-template-columns: 1fr; gap: 14px; }
    @media (min-width: 560px) { .grid { grid-template-columns: repeat(2, 1fr); } }
    @media (min-width: 900px) { .grid { grid-template-columns: repeat(3, 1fr); } }
    .tile { position: relative; display: block; text-decoration: none; color: var(--text);
            background: var(--card); border: 1px solid var(--border); border-radius: 18px; padding: 20px;
            min-height: 120px; transition: transform .12s, border-color .12s; }
    .tile.ready { cursor: pointer; }
    .tile.ready:hover { transform: translateY(-2px); border-color: var(--primary); }
    .tile.soon { opacity: .55; }
    .tile .ic { font-size: 1.9rem; }
    .tile .nm { font-weight: 700; font-size: 1.05rem; margin-top: 10px; }
    .tile .ds { color: var(--muted); font-size: .85rem; margin-top: 2px; }
    .tile .badge { position: absolute; top: 14px; right: 14px; font-size: .68rem; font-weight: 700;
                   color: var(--muted); border: 1px solid var(--border); border-radius: 999px; padding: 3px 8px; }
    .qr { width: 190px; height: 190px; background: #fff; border-radius: 12px; padding: 8px; margin: 8px auto; display: block; }
    .mono { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: .9rem; }
    .danger-btn { background: transparent; border: 1px solid var(--border); color: var(--danger);
                  border-radius: 12px; min-height: 46px; }
    a { color: var(--primary); }
  </style>
</head>
<body>
  <div id="app"><div class="spinner"></div></div>
  <script type="module" src="/app.js"></script>
</body>
</html>

<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <title>Packassistent</title>
  <style>
    /* CI: Schwarz + Türkis (fest, kein Hell-Modus) */
    :root {
      --bg: #000000;
      --card: #101a19;
      --text: #eaf6f4;
      --muted: #7e9997;
      --border: #223330;
      --primary: #2fd6c6;     /* Türkis */
      --primary-ink: #04231f;
      --danger: #ff6b6b;
      --ok: #2fd6c6;
      --gold: #2fd6c6;        /* Titel = Türkis */
      --radius: 16px;
      --safe-b: env(safe-area-inset-bottom, 0px);
      --safe-t: env(safe-area-inset-top, 0px);
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--bg); color: var(--text);
      line-height: 1.45; font-size: 16px;
      overflow-x: hidden;
    }
    /* Mobile-first: eine Spalte, volle Breite, nach oben hin zentriert */
    #app { max-width: 560px; margin: 0 auto; min-height: 100vh; }

    /* Sticky Kopf mit Safe-Area fürs Notch */
    header.appbar {
      position: sticky; top: 0; z-index: 20;
      display: flex; align-items: center; gap: 10px;
      padding: calc(10px + var(--safe-t)) 16px 10px;
      background: color-mix(in srgb, var(--card) 88%, transparent);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
    }
    header.appbar .title { font-weight: 700; font-size: 1.05rem; flex: 1; color: var(--gold); letter-spacing: .2px; }
    /* dezente, kleine Kopf-Buttons */
    header.appbar button { width: auto; min-height: 32px; padding: 5px 10px;
                           font-size: .75rem; font-weight: 500; color: var(--muted);
                           border-color: var(--border); }
    header.appbar button.bell { position: relative; font-size: 1rem; padding: 5px 8px; }
    .belldot { position: absolute; top: -3px; right: -3px; min-width: 16px; height: 16px;
               background: var(--danger); color: #2a0f0d; border-radius: 999px; font-size: .62rem;
               display: grid; place-items: center; font-weight: 700; padding: 0 3px; }

    main { padding: 16px; padding-bottom: calc(96px + var(--safe-b)); }
    .appnav { display: flex; gap: 6px; margin: 30px 0 0; }
    .appnav a { flex: 1; display: flex; flex-direction: row; align-items: center; justify-content: center; gap: 4px;
      text-decoration: none; color: var(--muted); font-weight: 600; font-size: .62rem;
      padding: 5px 4px; border: 1px solid var(--border); border-radius: 9px; background: transparent; }
    .appnav a.active { color: var(--primary); border-color: var(--primary); }
    .appnav a .i { font-size: .85rem; }
    .checkrow { display: flex; align-items: center; gap: 8px; font-size: .85rem; color: var(--text);
                font-weight: 500; margin: 14px 0 0; cursor: pointer; }
    .checkrow input { width: 18px; height: 18px; min-height: 0; accent-color: var(--primary); flex: 0 0 auto; }

    h1 { font-size: 1.4rem; margin: 0 0 4px; }
    h2 { font-size: 1.05rem; margin: 22px 0 10px; }
    p.muted { color: var(--muted); margin: 4px 0 16px; }
    .muted { color: var(--muted); }

    .card { background: var(--card); border: 1px solid var(--border);
            border-radius: var(--radius); padding: 16px; margin-bottom: 12px; }

    label { display: block; font-size: .8rem; color: var(--muted); margin: 12px 0 6px; font-weight: 600; }
    input, select, textarea, button {
      font: inherit; color: inherit; width: 100%;
      min-height: 48px; padding: 12px 14px;
      border-radius: 12px; border: 1px solid var(--border);
      background: var(--card);
    }
    textarea { min-height: 80px; }
    input:focus, select:focus, textarea:focus { outline: 2px solid var(--primary); border-color: var(--primary); }

    button { cursor: pointer; border: 1px solid var(--border); background: var(--card); font-weight: 600; }
    button.primary { background: var(--primary); color: var(--primary-ink); border-color: transparent; border-radius: 999px; }
    button.ghost { background: transparent; }
    button.danger { color: var(--danger); border-color: transparent; background: transparent; }
    button.block { width: 100%; }
    .row { display: flex; gap: 10px; }
    .row > * { flex: 1; }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; }
    .chip {
      width: auto; min-height: 40px; padding: 8px 14px; border-radius: 999px;
      border: 1px solid var(--border); background: var(--card); font-size: .9rem;
    }
    .chip.on { background: var(--primary); color: var(--primary-ink); border-color: transparent; }

    /* Sticky Aktionsleiste unten – Daumen-Reichweite */
    .actionbar {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
      display: flex; gap: 10px; max-width: 560px; margin: 0 auto;
      padding: 12px 16px calc(12px + var(--safe-b));
      background: color-mix(in srgb, var(--card) 92%, transparent);
      backdrop-filter: blur(10px); border-top: 1px solid var(--border);
    }

    /* Packlisten-Zeile: große Tap-Fläche */
    .pitem { display: flex; align-items: center; gap: 8px; padding: 6px 4px; min-width: 0;
             border-bottom: 1px solid var(--border); }
    .pitem:last-child { border-bottom: 0; }
    .pitem .check { width: 22px; height: 22px; min-height: 22px; flex: 0 0 auto; padding: 0;
                    border-radius: 50%; border: 2px solid var(--primary);
                    display: flex; align-items: center; justify-content: center;
                    font-size: 13px; line-height: 1; }
    .pitem .check.on { background: var(--ok); color: var(--primary-ink); border-color: transparent; }
    .qty-add { width: 27px; min-height: 27px; padding: 0; border-radius: 8px; flex: 0 0 auto; }
    /* min-width:0 lässt den Namen schrumpfen -> ✕ bleibt in der Karte */
    .pitem .name { flex: 1; min-width: 0; overflow-wrap: anywhere; font-size: .9rem; line-height: 1.3; }
    .pitem .name.done { text-decoration: line-through; color: var(--muted); }
    .qty { display: flex; align-items: center; gap: 4px; flex: 0 0 auto; }
    .qty button { width: 27px; min-height: 27px; padding: 0; border-radius: 8px; }
    .qty span { min-width: 16px; text-align: center; font-size: .9rem; }
    .pitem .danger { width: 24px; min-height: 24px; padding: 0; font-size: .78rem;
                     border-radius: 8px; flex: 0 0 auto; opacity: .8; }
    .cathead { display: flex; align-items: center; gap: 8px; margin: 0 0 6px; font-weight: 700;
               cursor: pointer; user-select: none; }
    .cathead .count { color: var(--muted); font-weight: 500; font-size: .85rem; margin-left: auto; }
    .cathead .chev { width: 16px; display: inline-block; transition: transform .15s; font-size: .8rem; color: var(--muted); }
    .cathead .chev.closed { transform: rotate(-90deg); }
    .cathead .catadd { width: 30px; min-height: 30px; padding: 0; border-radius: 8px; font-size: 1.1rem;
                       line-height: 1; color: var(--primary); }
    .addrow { display: flex; gap: 8px; padding: 10px 4px; }
    .addrow input { min-height: 42px; }
    .addrow button { width: auto; min-height: 42px; padding: 0 16px; }
    .addlink { width: 100%; text-align: left; min-height: 40px; padding: 8px 4px; background: transparent;
               border: 0; color: var(--muted); font-weight: 500; }
    /* Sticky Leiste: alle Kategorien ein-/ausklappen */
    .listbar { position: sticky; top: calc(52px + var(--safe-t)); z-index: 15;
               display: flex; align-items: center; gap: 8px; padding: 8px 0; margin: 2px 0 6px;
               background: var(--bg); border-bottom: 1px solid var(--border); }
    .listbar .lbl { margin-right: auto; font-size: .82rem; color: var(--muted); font-weight: 600; }
    /* Orts-Autocomplete */
    .suggest { position: absolute; left: 0; right: 0; top: calc(100% + 4px); z-index: 40;
               background: var(--card); border: 1px solid var(--border); border-radius: 12px;
               overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,.35); }
    .suggest-item { padding: 12px 14px; cursor: pointer; border-bottom: 1px solid var(--border); font-size: .92rem; }
    .suggest-item:last-child { border-bottom: 0; }
    /* Rückblick: gebraucht / unnötig */
    .tag-btn { width: auto; min-height: 36px; flex: 0 0 auto; padding: 6px 12px; border-radius: 999px;
               font-size: .82rem; background: transparent; }
    .tag-btn.on-ok { background: var(--ok); color: #06231c; border-color: transparent; }
    .tag-btn.on-bad { background: var(--danger); color: #2a0f0d; border-color: transparent; }
    .badge { font-size: .72rem; color: var(--muted); border: 1px solid var(--border);
             border-radius: 999px; padding: 2px 8px; }
    .mini-ic { width: 36px; min-height: 36px; flex: 0 0 auto; padding: 0; border-radius: 9px;
               background: transparent; border: 1px solid var(--border); font-size: 1rem; }
    .mini-ic.on { background: var(--primary); color: var(--primary-ink); border-color: transparent; }
    button.toggle-on { border-color: var(--primary); color: var(--primary); }
    .mini-input { min-height: 38px; padding: 8px 10px; font-size: .85rem; border-radius: 10px; }
    .center { text-align: center; }
    .spinner { margin: 40px auto; width: 28px; height: 28px; border: 3px solid var(--border);
               border-top-color: var(--primary); border-radius: 50%; animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .error { color: var(--danger); font-size: .9rem; }
    .list-clean { list-style: none; padding: 0; margin: 0; }
    a { color: var(--primary); }
    /* Übersicht: Reiter + Kacheln */
    .segmented { display: flex; gap: 6px; background: var(--card); border: 1px solid var(--border);
                 border-radius: 999px; padding: 4px; }
    .segmented button { flex: 1; border: 0; background: transparent; border-radius: 999px;
                        min-height: 38px; color: var(--muted); font-weight: 600; }
    .segmented button.on { background: var(--primary); color: var(--primary-ink); }
    .tiles { display: grid; grid-template-columns: 1fr; gap: 12px; }
    @media (min-width: 640px) { .tiles { grid-template-columns: repeat(2, 1fr); } }
    @media (min-width: 1000px) { .tiles { grid-template-columns: repeat(3, 1fr); } }
    .tile { position: relative; border-radius: 16px; overflow: hidden; aspect-ratio: 16 / 10;
            cursor: pointer; border: 1px solid var(--border);
            background: linear-gradient(135deg, #0e3b37, #061a19); }
    .tile img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
    .tile .overlay { position: absolute; inset: 0;
                     background: linear-gradient(to top, rgba(0,0,0,.85), rgba(0,0,0,.10) 55%, rgba(0,0,0,.30)); }
    .tile .meta { position: absolute; left: 0; right: 0; bottom: 0; padding: 12px 14px; }
    .tile .t-title { font-weight: 700; font-size: 1.02rem; color: #fff; }
    .tile .t-sub { font-size: .8rem; color: #d7f2ee; }
    .tile .t-actions { position: absolute; top: 8px; right: 8px; display: flex; gap: 6px; }
    .tile-ic { width: 32px; min-height: 32px; padding: 0; border-radius: 8px; border: 0;
               background: rgba(0,0,0,.45); color: #fff; font-size: .9rem; }
    .tile .t-badge { position: absolute; top: 8px; left: 8px; background: var(--primary); color: var(--primary-ink);
                     font-size: .72rem; font-weight: 700; padding: 3px 8px; border-radius: 999px; }
    /* Modal */
    .modal-overlay { position: fixed; inset: 0; z-index: 100; background: rgba(0,0,0,.6);
                     display: flex; align-items: center; justify-content: center; padding: 20px;
                     backdrop-filter: blur(3px); }
    .modal { width: 100%; max-width: 420px; background: var(--card); border: 1px solid var(--border);
             border-radius: 18px; padding: 22px; box-shadow: 0 20px 60px rgba(0,0,0,.55); }
    .modal h3 { font-size: 1.1rem; }
    /* Desktop/Laptop: mehr Breite + mehrspaltige Kategorien (alles auf einen Blick) */
    .catblock { break-inside: avoid; -webkit-column-break-inside: avoid; }
    .wizcards > .card { break-inside: avoid; -webkit-column-break-inside: avoid; }
    @media (min-width: 900px) {
      #app { max-width: 1000px; }
      .actionbar { max-width: 1000px; }
      .cats { column-count: 2; column-gap: 16px; }
      .wizcards { column-count: 2; column-gap: 16px; }
    }
    @media (min-width: 1200px) {
      #app { max-width: 1440px; }
      .actionbar { max-width: 1440px; }
      .cats { column-count: 4; }
    }
  </style>
</head>
<body>
  <div id="app"><div class="spinner"></div></div>
  <script type="module" src="/app.js"></script>
</body>
</html>

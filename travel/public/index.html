<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#2a3038" />
  <title>Packassistent</title>
  <style>
    /* CI: "Soft Summer / Soft Autumn" – warmes Dunkel-Theme als Standard */
    :root {
      --bg: #2a3038;          /* dunkles Warm-Navy */
      --card: #343b45;        /* Warm-Navy Fläche */
      --text: #f3ecdd;        /* Creme */
      --muted: #b3a992;       /* Warm Gray / Taupe */
      --border: #444b56;
      --primary: #8fb39b;     /* Sage */
      --primary-ink: #1e2b25;
      --danger: #d68d84;      /* Muted Rose / Coral */
      --ok: #7aa6ad;          /* Dusty / Smokey Blue */
      --gold: #c9a24b;        /* Gold-Akzent */
      --radius: 16px;
      --safe-b: env(safe-area-inset-bottom, 0px);
      --safe-t: env(safe-area-inset-top, 0px);
    }
    /* Helles Creme-Theme aus derselben Palette (nur wenn Gerät hell will) */
    @media (prefers-color-scheme: light) {
      :root {
        --bg: #f4eee1;        /* Beige / Creme */
        --card: #fffdf6;
        --text: #45423a;      /* dunkles Taupe */
        --muted: #8a8272;     /* Warm Gray */
        --border: #e5ddca;
        --primary: #5f9079;   /* Sage (kräftiger für Kontrast) */
        --primary-ink: #ffffff;
        --danger: #bd6f68;    /* Coral / Muted Purple */
        --ok: #5a8f97;        /* Smokey Blue */
        --gold: #b8912f;
      }
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--bg); color: var(--text);
      line-height: 1.45; font-size: 16px;
      overflow-x: hidden;
    }
    /* Mobile-first: eine Spalte, volle Breite, nach oben hin zentriert */
    #app { max-width: 560px; margin: 0 auto; min-height: 100vh; }

    /* Sticky Kopf mit Safe-Area fürs Notch */
    header.appbar {
      position: sticky; top: 0; z-index: 20;
      display: flex; align-items: center; gap: 10px;
      padding: calc(10px + var(--safe-t)) 16px 10px;
      background: color-mix(in srgb, var(--card) 88%, transparent);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
    }
    header.appbar .title { font-weight: 700; font-size: 1.05rem; flex: 1; color: var(--gold); letter-spacing: .2px; }
    /* dezente, kleine Kopf-Buttons */
    header.appbar button { width: auto; min-height: 32px; padding: 5px 10px;
                           font-size: .75rem; font-weight: 500; color: var(--muted);
                           border-color: var(--border); }

    main { padding: 16px; padding-bottom: calc(96px + var(--safe-b)); }

    h1 { font-size: 1.4rem; margin: 0 0 4px; }
    h2 { font-size: 1.05rem; margin: 22px 0 10px; }
    p.muted { color: var(--muted); margin: 4px 0 16px; }

    .card { background: var(--card); border: 1px solid var(--border);
            border-radius: var(--radius); padding: 16px; margin-bottom: 12px; }

    label { display: block; font-size: .8rem; color: var(--muted); margin: 12px 0 6px; font-weight: 600; }
    input, select, textarea, button {
      font: inherit; color: inherit; width: 100%;
      min-height: 48px; padding: 12px 14px;
      border-radius: 12px; border: 1px solid var(--border);
      background: var(--card);
    }
    textarea { min-height: 80px; }
    input:focus, select:focus, textarea:focus { outline: 2px solid var(--primary); border-color: var(--primary); }

    button { cursor: pointer; border: 1px solid var(--border); background: var(--card); font-weight: 600; }
    button.primary { background: var(--primary); color: var(--primary-ink); border-color: transparent; }
    button.ghost { background: transparent; }
    button.danger { color: var(--danger); border-color: transparent; background: transparent; }
    button.block { width: 100%; }
    .row { display: flex; gap: 10px; }
    .row > * { flex: 1; }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; }
    .chip {
      width: auto; min-height: 40px; padding: 8px 14px; border-radius: 999px;
      border: 1px solid var(--border); background: var(--card); font-size: .9rem;
    }
    .chip.on { background: var(--primary); color: var(--primary-ink); border-color: transparent; }

    /* Sticky Aktionsleiste unten – Daumen-Reichweite */
    .actionbar {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
      display: flex; gap: 10px; max-width: 560px; margin: 0 auto;
      padding: 12px 16px calc(12px + var(--safe-b));
      background: color-mix(in srgb, var(--card) 92%, transparent);
      backdrop-filter: blur(10px); border-top: 1px solid var(--border);
    }

    /* Packlisten-Zeile: große Tap-Fläche */
    .pitem { display: flex; align-items: center; gap: 12px; padding: 12px 4px;
             border-bottom: 1px solid var(--border); }
    .pitem:last-child { border-bottom: 0; }
    .pitem .check { width: 26px; height: 26px; min-height: 26px; flex: 0 0 auto; padding: 0;
                    border-radius: 8px; display: grid; place-items: center; }
    .pitem .check.on { background: var(--ok); color: #fff; border-color: transparent; }
    .pitem .name { flex: 1; }
    .pitem .name.done { text-decoration: line-through; color: var(--muted); }
    .qty { display: flex; align-items: center; gap: 6px; }
    .qty button { width: 34px; min-height: 34px; padding: 0; border-radius: 8px; }
    .qty span { min-width: 20px; text-align: center; }
    .cathead { display: flex; align-items: center; gap: 8px; margin: 18px 0 6px; font-weight: 700;
               cursor: pointer; user-select: none; }
    .cathead .count { color: var(--muted); font-weight: 500; font-size: .85rem; margin-left: auto; }
    .cathead .chev { width: 16px; display: inline-block; transition: transform .15s; font-size: .8rem; color: var(--muted); }
    .cathead .chev.closed { transform: rotate(-90deg); }
    .cathead .catadd { width: 30px; min-height: 30px; padding: 0; border-radius: 8px; font-size: 1.1rem;
                       line-height: 1; color: var(--primary); }
    .addrow { display: flex; gap: 8px; padding: 10px 4px; }
    .addrow input { min-height: 42px; }
    .addrow button { width: auto; min-height: 42px; padding: 0 16px; }
    .badge { font-size: .72rem; color: var(--muted); border: 1px solid var(--border);
             border-radius: 999px; padding: 2px 8px; }
    .mini-ic { width: 36px; min-height: 36px; flex: 0 0 auto; padding: 0; border-radius: 9px;
               background: transparent; border: 1px solid var(--border); font-size: 1rem; }
    .center { text-align: center; }
    .spinner { margin: 40px auto; width: 28px; height: 28px; border: 3px solid var(--border);
               border-top-color: var(--primary); border-radius: 50%; animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .error { color: var(--danger); font-size: .9rem; }
    .list-clean { list-style: none; padding: 0; margin: 0; }
    a { color: var(--primary); }
  </style>
</head>
<body>
  <div id="app"><div class="spinner"></div></div>
  <script type="module" src="/app.js"></script>
</body>
</html>

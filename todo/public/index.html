<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <title>To-Do</title>
  <style>
    :root {
      --bg: #000000; --card: #101a19; --text: #eaf6f4; --muted: #7e9997; --border: #223330;
      --primary: #2fd6c6; --primary-ink: #04231f; --danger: #ff6b6b;
      --safe-b: env(safe-area-inset-bottom, 0px); --safe-t: env(safe-area-inset-top, 0px);
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; padding: 0; }
    body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--bg);
           color: var(--text); line-height: 1.45; }
    #app { max-width: 900px; margin: 0 auto; min-height: 100vh; }
    header.appbar { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 8px;
                    padding: calc(12px + var(--safe-t)) 16px 12px;
                    background: color-mix(in srgb, var(--card) 88%, transparent);
                    backdrop-filter: blur(10px); border-bottom: 1px solid var(--border); }
    header.appbar .title { font-weight: 800; font-size: 1.12rem; flex: 1; color: var(--primary); letter-spacing: .3px;
                           overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    header.appbar button { width: auto; min-height: 34px; padding: 6px 12px; font-size: .8rem; font-weight: 500;
                           color: var(--muted); background: transparent; border: 1px solid var(--border); border-radius: 10px; }
    main { padding: 16px 16px calc(90px + var(--safe-b)); }
    .appnav { display: flex; gap: 6px; margin: 30px 0 0; }
    .appnav a { flex: 1; display: flex; flex-direction: row; align-items: center; justify-content: center; gap: 4px;
      text-decoration: none; color: var(--muted); font-weight: 600; font-size: .62rem;
      padding: 5px 4px; border: 1px solid var(--border); border-radius: 9px; background: transparent; min-height: auto; }
    .appnav a.active { color: var(--primary); border-color: var(--primary); }
    .appnav a .i { font-size: .85rem; }
    .checkrow { display: flex; align-items: center; gap: 8px; font-size: .85rem; color: var(--text);
                font-weight: 500; margin: 14px 0 0; cursor: pointer; }
    .checkrow input { width: 18px; height: 18px; min-height: 0; accent-color: var(--primary); flex: 0 0 auto; }
    h1 { font-size: 1.4rem; margin: 4px 0 2px; }
    h2 { font-size: 1.02rem; margin: 20px 0 8px; color: var(--muted); font-weight: 700; text-transform: uppercase; letter-spacing: .5px; }
    p.muted { color: var(--muted); margin: 4px 0 16px; }
    .muted { color: var(--muted); }
    label { display: block; font-size: .8rem; color: var(--muted); margin: 12px 0 6px; font-weight: 600; }
    input, textarea, select, button { font: inherit; color: inherit; }
    input, textarea, select { width: 100%; min-height: 46px; padding: 11px 13px;
                    border-radius: 12px; border: 1px solid var(--border); background: var(--card); }
    textarea { min-height: 70px; resize: vertical; }
    input:focus, textarea:focus, select:focus { outline: 2px solid var(--primary); border-color: var(--primary); }
    button { cursor: pointer; font-weight: 600; background: transparent; border: none; }
    .btn { width: 100%; min-height: 48px; padding: 12px 14px; border-radius: 12px;
           border: 1px solid var(--border); background: var(--card); }
    .primary { background: var(--primary); color: var(--primary-ink); border: 1px solid transparent; border-radius: 999px;
               min-height: 48px; padding: 12px 18px; }
    .ghost { background: transparent; border: 1px solid var(--border); border-radius: 12px; min-height: 44px; padding: 10px 14px; }
    .block { width: 100%; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 16px; }
    .error { color: var(--danger); font-size: .9rem; }
    .center { text-align: center; }
    a { color: var(--primary); }
    .spinner { margin: 40px auto; width: 28px; height: 28px; border: 3px solid var(--border);
               border-top-color: var(--primary); border-radius: 50%; animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Tabs */
    .tabs { display: flex; gap: 8px; margin: 4px 0 12px; }
    .tabs button { flex: 1; min-height: 40px; border: 1px solid var(--border); border-radius: 999px;
                   background: transparent; color: var(--muted); font-weight: 600; }
    .tabs button.active { background: var(--primary); color: var(--primary-ink); border-color: transparent; }

    /* Listen-Kacheln */
    .lists { display: grid; grid-template-columns: 1fr; gap: 12px; }
    @media (min-width: 620px) { .lists { grid-template-columns: repeat(2, 1fr); } }
    .listcard { display: flex; align-items: center; gap: 10px; text-align: left; margin-bottom: 10px; }
    .drag { cursor: grab; color: var(--muted); font-size: 1.1rem; line-height: 1; padding: 6px 4px;
            user-select: none; touch-action: none; flex: 0 0 auto; letter-spacing: -2px; }
    .dragging { opacity: .55; }
    .listcard .nm { flex: 1; font-weight: 700; font-size: 1.05rem; overflow: hidden; text-overflow: ellipsis; }
    .listcard .cnt { color: var(--muted); font-size: .85rem; }
    .listcard .del { color: var(--muted); font-size: 1rem; width: auto; min-height: auto; padding: 4px 6px; }

    /* Task-Zeile */
    .task { display: flex; align-items: flex-start; gap: 11px; padding: 11px 0; border-bottom: 1px solid var(--border); }
    .task .check { flex: 0 0 auto; width: 22px; height: 22px; margin-top: 1px; border-radius: 50%;
                   border: 2px solid var(--muted); background: transparent; display: flex; align-items: center;
                   justify-content: center; padding: 0; min-height: auto; color: var(--primary-ink); font-size: .8rem; }
    .task .check.p1 { border-color: var(--danger); }
    .task .body { flex: 1; min-width: 0; }
    .task .ttl { overflow-wrap: anywhere; }
    .task .meta { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
    .chip { font-size: .72rem; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--border);
            color: var(--muted); display: inline-flex; align-items: center; gap: 4px; }
    .chip.due { border-color: color-mix(in srgb, var(--primary) 50%, var(--border)); color: var(--primary); }
    .chip.due.over { border-color: var(--danger); color: var(--danger); }
    .chip.prio { }
    .task .tools { display: flex; gap: 2px; flex: 0 0 auto; }
    .task .tools button { color: var(--muted); font-size: .95rem; width: auto; min-height: auto; padding: 4px 6px; }
    .task .caret { transition: transform .15s; display: inline-block; }
    .task .caret.open { transform: rotate(90deg); }
    .subwrap { margin: 0 0 6px 33px; }
    .sub { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px dashed var(--border); }
    .sub .check { width: 18px; height: 18px; border-width: 2px; font-size: .7rem; }
    .sub .ttl { flex: 1; min-width: 0; font-size: .92rem; overflow-wrap: anywhere; }
    .sub .del { color: var(--muted); width: auto; min-height: auto; padding: 2px 6px; }
    .addsub { display: flex; gap: 8px; align-items: center; padding: 8px 0 2px; }
    .addsub input { min-height: 40px; }
    .addsub button { flex: 0 0 auto; }
    .done .ttl { text-decoration: line-through; color: var(--muted); }

    /* FAB */
    .fab { position: fixed; right: calc(18px); bottom: calc(20px + var(--safe-b)); z-index: 30;
           width: auto; min-height: 54px; padding: 0 22px; border-radius: 999px; background: var(--primary);
           color: var(--primary-ink); font-weight: 800; font-size: 1rem; border: none;
           box-shadow: 0 8px 24px rgba(0,0,0,.5); display: flex; align-items: center; gap: 8px; }

    /* Modal */
    .overlay { position: fixed; inset: 0; z-index: 40; background: rgba(0,0,0,.6); backdrop-filter: blur(3px);
               display: flex; align-items: flex-end; justify-content: center; padding: 0; }
    @media (min-width: 560px) { .overlay { align-items: center; padding: 20px; } }
    .modal { width: 100%; max-width: 480px; background: var(--card); border: 1px solid var(--border);
             border-radius: 20px 20px 0 0; padding: 20px 18px calc(20px + var(--safe-b)); }
    @media (min-width: 560px) { .modal { border-radius: 20px; } }
    .modal h3 { margin: 0 0 6px; font-size: 1.15rem; }
    .prios { display: flex; gap: 8px; flex-wrap: wrap; }
    .prios button { flex: 1 1 40px; min-width: 40px; min-height: 44px; border-radius: 12px; border: 1px solid var(--border);
                    background: transparent; color: var(--text); font-weight: 700; }
    .prios button.sel { background: var(--primary); color: var(--primary-ink); border-color: transparent; }
    .prios button.none { flex: 1 1 100%; color: var(--muted); font-weight: 600; }
    .row2 { display: flex; gap: 10px; margin-top: 16px; }
    .row2 .primary, .row2 .ghost, .row2 .danger-solid { flex: 1; }
    .emptyhint { color: var(--muted); text-align: center; padding: 30px 10px; }
    .offlinebar { background: color-mix(in srgb, var(--primary) 12%, var(--card)); border: 1px solid var(--border);
                  border-radius: 12px; padding: 9px 14px; font-size: .82rem; color: var(--primary);
                  margin-bottom: 14px; text-align: center; }

    /* Segmentiertes Umschalten (Listentyp, Katalog-Ansicht) */
    .seg { display: flex; gap: 6px; }
    .seg button { flex: 1; min-height: 42px; border: 1px solid var(--border); border-radius: 10px;
                  background: transparent; color: var(--muted); font-weight: 600; font-size: .85rem; }
    .seg button.on { background: var(--primary); color: var(--primary-ink); border-color: transparent; }

    /* Vorschlagsliste beim Eintippen eines Einkaufsartikels */
    .suggest { margin-top: 8px; border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
    .sugrow { display: flex; align-items: center; gap: 8px; width: 100%; text-align: left;
              padding: 10px 12px; border-bottom: 1px solid var(--border); background: var(--card); font-weight: 500; }
    .sugrow:last-child { border-bottom: none; }

    /* Katalog-Auswahl / Liste-verschieben-Auswahl */
    .picklist { max-height: 55vh; overflow-y: auto; margin-top: 4px; }
    .pickrow { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left;
               padding: 12px 4px; border-bottom: 1px solid var(--border); background: transparent; font-weight: 500; }
    .pickrow.sub { padding-left: 30px; font-size: .92rem; color: var(--muted); }
    .catrow { display: flex; align-items: center; gap: 8px; width: 100%; text-align: left;
              padding: 12px 4px; border-bottom: 1px solid var(--border); background: transparent; font-weight: 700; }

    /* Editor-Kopfzeile mit Speichern oben */
    .editbar { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 10px; }
    .editbar strong { font-size: 1.02rem; }
    .editbar .primary { border-radius: 999px; min-height: 40px; padding: 8px 18px; }
    .editbar .ghost { min-height: 40px; padding: 8px 12px; border: 1px solid var(--border); border-radius: 12px; color: var(--muted); }

    /* Detailseite */
    .detailbar { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .detailbar .ghost { min-height: 40px; padding: 8px 12px; border: 1px solid var(--border); border-radius: 12px; color: var(--muted); }

    /* Roter Bestätigungs-Button */
    .danger-solid { background: var(--danger); color: #2a0808; border: 1px solid transparent; border-radius: 999px;
                    min-height: 48px; padding: 12px 18px; font-weight: 700; }
    .modal.confirm h3 { font-size: 1.08rem; }
  </style>
</head>
<body>
  <div id="app"><div class="spinner"></div></div>
  <script type="module" src="/app.js"></script>
</body>
</html>

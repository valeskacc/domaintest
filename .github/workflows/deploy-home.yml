name: Deploy Home

on:
  workflow_dispatch: {}
  push:
    paths:
      - "home/**"
      - ".github/workflows/deploy-home.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy home board
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: home
          wranglerVersion: "4"
